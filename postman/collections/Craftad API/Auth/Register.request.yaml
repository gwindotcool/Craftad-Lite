$kind: http-request
method: POST
url: '{{baseUrl}}/api/auth/register'
order: 1000
auth:
  type: noauth
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "fullName": "John Doe",
      "email": "john@example.com",
      "password": "password123",
      "role": "customer"
    }
